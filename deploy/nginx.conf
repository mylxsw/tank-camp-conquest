# envsubst template: SERVER_HOST, SERVER_PORT, COLYSEUS_PATH
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 256;

    # Runtime client config (generated by entrypoint)
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files /config.json =404;
    }

    # Colyseus HTTP (matchmake) + WebSocket — strip path prefix
    location ${COLYSEUS_PATH}/ {
        proxy_pass http://${SERVER_HOST}:${SERVER_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Exact path without trailing slash
    location = ${COLYSEUS_PATH} {
        return 301 ${COLYSEUS_PATH}/;
    }

    # SPA static
    location / {
        try_files $uri $uri/ /index.html;
    }
}
