# Edge: Caddy (HTTP or auto-HTTPS) → nginx web (static + /colyseus) → Colyseus server
#
# HTTP (IP):   DOMAIN=  SITE_ADDRESS=:80
# HTTPS:       DOMAIN=game.example.com  SITE_ADDRESS=game.example.com

services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${SERVER_PORT:-2567}
    expose:
      - "${SERVER_PORT:-2567}"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "80"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-${DOMAIN:-localhost}}
      COLYSEUS_PATH: ${COLYSEUS_PATH:-/colyseus}
      COLYSEUS_URL: ${COLYSEUS_URL:-}
      SERVER_HOST: server
      SERVER_PORT: ${SERVER_PORT:-2567}
      NGINX_ENVSUBST_FILTER: "SERVER_HOST|SERVER_PORT|COLYSEUS_PATH"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
